<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <meta name="description" content="Hypno — a Castalia Institute project.">
  <title>Hypno — Castalia Institute</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131b;
      color: #edf0f7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(ellipse at 50% 42%, #272841 0, #171a27 38%, #10131b 76%);
    }
    main { width: min(100%, 48rem); text-align: center; }
    .mark {
      width: 4.5rem;
      height: 4.5rem;
      display: grid;
      place-items: center;
      margin: 0 auto 2rem;
      border: 1px solid #7775a4;
      border-radius: 50%;
      color: #d4c8ff;
      font-size: 1.75rem;
      box-shadow: 0 0 3rem #9b84ff26, inset 0 0 1.5rem #9b84ff16;
    }
    .eyebrow {
      color: #b9addd;
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 1rem 0 .75rem;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 520;
      letter-spacing: -.075em;
      line-height: .95;
    }
    p { color: #b8bbca; font-size: 1.05rem; line-height: 1.7; }
    footer { margin-top: 5rem; color: #82869a; font-size: .78rem; letter-spacing: .08em; }
    a { color: inherit; text-decoration-color: #7775a4; text-underline-offset: .25em; }
    a:hover { color: #d4c8ff; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <div class="eyebrow">Castalia Institute</div>
    <h1>Hypno</h1>
    <p>A new project is taking shape.</p>
    <footer><a href="https://castalia.institute">CASTALIA.INSTITUTE ↗</a></footer>
  </main>
</body>
</html>
